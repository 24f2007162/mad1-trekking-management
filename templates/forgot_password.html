{% extends "base.html" %}

{% block content %}

<div class="admin-hero">

<h1>

Reset Password

</h1>

<p>

Enter your email and choose a new password

</p>

</div>


<form
method="POST"
class="login-panel"
>

<input
type="email"
name="email"
placeholder="Registered Email"
required
/>

<input
type="password"
name="password"
placeholder="New Password"
required
/>

<button
class="login-btn"
type="submit"
>

Update Password

</button>

</form>

{% endblock %}
