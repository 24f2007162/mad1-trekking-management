{%extends "base.html"%}
{%block content%}
<h1>Trek Creation Form</h1>
<form method="POST">
  <input
   type = "text"
   name="name"
   placeholder="Trek Name"
   required
  >
  <input
  type = "text"
  name = "location"
  placeholder="Location"
  required
  >
  <input
  type = "text"
  name = "difficulty"
  placeholder="Difficulty"
  required
  >
  <input
   type = "number"
   name = "duration"
   placeholder="Duration of Trek"
   required
  >
  <input
  type = "number"
  name = "slots"
  placeholder="Slots Available"
  required  
  >
  <button type="submit">Create Trek</button>
  


</form>

{%endblock%}
