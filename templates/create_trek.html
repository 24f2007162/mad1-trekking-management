{% extends "base.html" %}

{% block title %}
Create Trek | Musafir Treks
{% endblock %}

{% block content %}

<!-- ================= HERO ================= -->

<section class="admin-hero">

    <h1>
        Create New Trek
    </h1>

    <p>
        Add a new trekking adventure to the Musafir platform.
    </p>

</section>

<!-- ================= FORM ================= -->

<section class="form-section">

    <div class="form-card">

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">

                    <label>Trek Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Eg. Kedarkantha Trek"
                        required>

                </div>

                <div class="form-group">

                    <label>Location</label>

                    <input
                        type="text"
                        name="location"
                        placeholder="Eg. Uttarakhand"
                        required>

                </div>

                <div class="form-group">

                    <label>Difficulty</label>

                    <input
                        type="text"
                        name="difficulty"
                        placeholder="Easy / Moderate / Difficult"
                        required>

                </div>

                <div class="form-group">

                    <label>Duration (Days)</label>

                    <input
                        type="number"
                        name="duration"
                        placeholder="4"
                        required>

                </div>

                <div class="form-group">

                    <label>Available Slots</label>

                    <input
                        type="number"
                        name="slots"
                        placeholder="30"
                        required>

                </div>

                <div class="form-group">

                    <label>Image Filename</label>

                    <input
                        type="text"
                        name="image"
                        placeholder="kedarkantha.jpg">

                </div>

                <div class="form-group full-width">

                    <label>Assign Guide</label>

                    <select name="staff_id">

                        <option value="">
                            Select Staff Member
                        </option>

                        {% for member in staff %}

                        <option value="{{ member.id }}">
                            {{ member.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>

            <button
                type="submit"
                class="btn">

                Create Trek

            </button>

        </form>

    </div>

</section>

{% endblock %}
