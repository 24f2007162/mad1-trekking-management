{% extends "base.html" %}

{% block title %}
Edit Trek | Musafir Treks
{% endblock %}

{% block content %}

<!-- ================= HERO ================= -->

<section class="admin-hero">

  <h1>

    Edit Trek

  </h1>

  <p>

    Update trek information and guide assignment.

  </p>

</section>

<!-- ================= FORM ================= -->

<section class="form-section">

  <div class="form-card">

    <form method="POST">

      <div class="form-grid">

        <div class="form-group">

          <label>Trek Name</label>

          <input type="text" name="name" value="{{ trek.name }}" required>

        </div>

        <div class="form-group">

          <label>Location</label>

          <input type="text" name="location" value="{{ trek.location }}" required>

        </div>

        <div class="form-group">

          <label>Difficulty</label>

          <input type="text" name="difficulty" value="{{ trek.difficulty }}" required>

        </div>

        <div class="form-group">

          <label>Duration (Days)</label>

          <input type="number" name="duration" value="{{ trek.duration }}" required>

        </div>

        <div class="form-group">

          <label>Available Slots</label>

          <input type="number" name="slots" value="{{ trek.available_slots }}" required>

        </div>

        <div class="form-group">

          <label>Image Filename</label>

          <input type="text" name="image" value="{{ trek.image }}">

        </div>

        <div class="form-group full-width">

          <label>Assign Guide</label>

          <select name="staff_id">

            <option value="">
              Unassign Staff
            </option>

            {% for member in staff %}

            <option value="{{ member.id }}" {% if trek.staff_id==member.id %}selected{% endif %}>

              {{ member.name }}

            </option>

            {% endfor %}

          </select>

        </div>

      </div>

      <button type="submit" class="btn">

        Update Trek

      </button>

    </form>

  </div>

</section>

{% endblock %}
