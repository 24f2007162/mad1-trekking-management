{%extends "base.html"%}
{%block content%}
 <h1>All Users</h1>
 <table border = "1">
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Role</th>
    <th>Status</th>
  </tr>
  {%for user in users%}
  <tr>
    <td>{{user.id}}</td>
    <td>{{user.name}}</td>
    <td>{{user.email}}</td>
    <td>{{user.role}}</td>
    <td>{{user.status}}</td>
  </tr>
  {%endfor%}
 </table>


{%endblock%}
